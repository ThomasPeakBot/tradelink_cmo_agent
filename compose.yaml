services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradelink
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tradelink
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tradelink-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradelink -d tradelink']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tradelink-data:
